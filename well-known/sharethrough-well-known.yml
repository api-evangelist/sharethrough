notes:
  - >-
    A WellKnown pointer is wired for this repo because at least one probe returned a 200
    carrying a real machine-readable document. The honest qualifier is that it is served by
    the company's identity vendor tenant, not by sharethrough.com or by the reporting API
    host — neither of those serves anything at /.well-known/.
  - No security.txt is published on any Sharethrough host, so no SecurityTxt pointer is emitted.
  - No agent card was found at either /.well-known/agent-card.json or /.well-known/agent.json on any host.
