  - host: sharethrough-users.auth0.com
    path: /.well-known/openid-configuration
    status: 200
    file: sharethrough-openid-configuration.json
    content_type: application/json
    note: >-
      Real OpenID Provider Metadata (RFC 8414 / OpenID Connect Discovery 1.0) for the
      Sharethrough-controlled Auth0 tenant. Discovered by following the publisher-platform
      login at http://nag.sharethrough.com, which 302s to
      https://sharethrough-users.auth0.com/u/login. The tenant name and the signing
      certificate CN are both sharethrough-users.auth0.com.
  - host: sharethrough-users.auth0.com
    path: /.well-known/oauth-authorization-server
    status: 200
    file: sharethrough-oauth-authorization-server.json
    content_type: application/json
    note: RFC 8414 Authorization Server Metadata; byte-identical to the OIDC discovery document.
  - host: sharethrough-users.auth0.com
    path: /.well-known/jwks.json
    status: 200
    note: >-
