name: Sharethrough Well-Known Discovery Probe
description: >-
  Record of every RFC 8615 /.well-known/ path probed across the Sharethrough hosts named in
  apis.yml plus the identity host the publisher platform login redirects to. Sharethrough's
  own web, exchange and reporting hosts serve nothing at /.well-known/. The one real hit is
  the OpenID Connect / OAuth 2.0 Authorization Server Metadata published by the company's
  own Auth0 tenant (sharethrough-users.auth0.com), which is reached by following the
  publisher-platform login at nag.sharethrough.com.
generated: '2026-08-12'
method: probed
source: live HTTPS probes, 2026-08-12
hosts_probed:
  - www.sharethrough.com
  - support.sharethrough.com
  - api.sharethrough.com
  - publisher-api.sharethrough.com
  - btlr.sharethrough.com
  - iab.sharethrough.com
  - sharethrough-users.auth0.com
probes:
