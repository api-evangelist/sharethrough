plans:
  - name: Publisher SSP (Supply-Side Platform)
    kind: commercial relationship, not a published plan
    description: >-
      Access to the Sharethrough omnichannel exchange for publishers monetising native,
      display, video and CTV inventory through programmatic real-time bidding and header
      bidding. Includes Publisher Reporting API access.
    url: https://www.sharethrough.com/publishers
    pricingModel: revenue share
    price: null
    currency: null
    billing_period: null
    included_quota: null
    overage: null
    limits: null
    pricing: contact for pricing
    features:
      - Native, display, video and CTV formats
      - Header bidding via the Prebid.js sharethrough adapter
      - OpenRTB 2.x bidding
      - Ad quality and brand safety controls
      - Publisher Reporting API access
      - Sustainability metrics (Scope3 Climate Shield)
      - Real-time reporting and analytics
  - name: Advertiser / DSP Integration
    kind: commercial relationship, not a published plan
    description: >-
      Access for demand-side platforms and advertisers to buy Sharethrough inventory. Requires
      integration setup and approval by the Sharethrough Integrations team.
    url: https://www.sharethrough.com/advertisers
    pricingModel: CPM / revenue share
    price: null
    currency: null
    billing_period: null
    included_quota: null
    overage: null
    limits: null
    pricing: contact for pricing
    features:
      - OpenRTB native, display, video and CTV buying
      - SSP/DSP integration via IAB OpenRTB
      - Placement key (pkey) based targeting
      - First-party data via the ortb2 standard
      - Category and advertiser domain blocking (ortb2.bcat / ortb2.badv)
      - Equativ exchange routing (eqtvNetworkId)
      - Carbon emissions reporting
terms:
  publisher_platform: https://www.sharethrough.com/publisher-platform-terms-of-service
  managed_services: https://www.sharethrough.com/managed-services-terms-of-service
  data_processing_addendum: https://www.sharethrough.com/data-processing-addendum
notes:
  - >-
    plan_count is 0 by design: there are no published tiers to count. Recording the file with
    an explicit zero is the honest form, rather than omitting it or presenting the two
    relationship descriptions above as priced plans.
  - >-
    No pricing page exists anywhere in the 627-URL sitemap. The apis.yml Pricing pointer that a
    previous round wired to https://www.sharethrough.com/publishers was removed in this pass:
    that URL is a marketing landing page with a contact form, not a pricing page, and the
    pointer asserted a page the provider does not publish.
  - >-
    Prebid.js adapter access additionally requires explicit approval from the Sharethrough
    Integrations team, so even the free, open-source integration path is gated on a
    conversation.
