name: Sharethrough
description: >-
  Sharethrough is an omnichannel programmatic advertising exchange (SSP) for native, display,
  video and CTV inventory, and one of the largest independent ad marketplaces. Publishers
  monetise through the Prebid.js header-bidding adapter and server-to-server OpenRTB; demand
  partners buy through the exchange. Two API surfaces exist: a bearer-token Publisher
  Reporting API at publisher-api.sharethrough.com/v2 whose public reference is now behind a
  support-site sign-in, and the unauthenticated OpenRTB bid endpoint at
  btlr.sharethrough.com/universal/v1 used by the Prebid adapter. The company's richest
  machine-readable artifact is its IAB sellers.json (5,189 sellers). Sharethrough merged with
  Equativ in 2024 and has operated under the Equativ brand since June 2025; the Sharethrough
  exchange and its endpoints continue to run.
