      - type: Conventions
        url: conventions/sharethrough-conventions.yml
      - type: DataModel
        url: data-model/sharethrough-data-model.yml
  - name: Sharethrough Header Bidding (Prebid) API
    description: >-
      OpenRTB 2.x bid endpoint at /universal/v1, integrated through the first-party
      sharethrough bidder adapter in Prebid.js (adapter version 4.3.0, IAB GVL ID 80).
      Supports banner, native and video/CTV, the price floors module, supply chain objects,
      SafeFrame, and GDPR/TCF, CCPA/USP and COPPA signalling. Publishers identify placements
      with a pkey; eqtvNetworkId routes the request to the Equativ exchange.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://docs.prebid.org/dev-docs/bidders/sharethrough.html
    baseURL: https://btlr.sharethrough.com
    tags:
