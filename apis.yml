apis:
  - name: Sharethrough Publisher Reporting API
    description: >-
      REST-ish reporting API enabling publishers to pull programmatic performance data for
      their Sharethrough inventory. A single POST /v2/programmatic endpoint takes a query
      object (startDate, endDate, groupBy, fields, filterBy) and returns CSV by default or
      JSON when negotiated by the Accept header. Bearer-token authentication. The v1 surface
      is retired and returns 503; the reference documentation now requires a support-site
      sign-in.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://support.sharethrough.com/hc/en-us/sections/360009157451-Publisher-API-for-Reporting
    baseURL: https://publisher-api.sharethrough.com/v2
    tags:
      - Publisher
      - Reporting
      - Native Advertising
    properties:
      - type: Documentation
        url: https://support.sharethrough.com/hc/en-us/sections/360009157451-Publisher-API-for-Reporting
      - type: GitHubRepository
        url: https://github.com/strchives/publisher-api-examples
      - type: Authentication
        url: authentication/sharethrough-authentication.yml
      - type: ErrorCatalog
